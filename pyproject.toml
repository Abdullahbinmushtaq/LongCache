[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longcache"
version = "0.1.0"
description = "Semantic similarity cache for LLM and RAG pipelines — cut repeat query costs by 40%+"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ENDEVSOLS", email = "technology@endevsols.com" },
]
keywords = [
    "llm",
    "cache",
    "rag",
    "semantic-cache",
    "vector-search",
    "faiss",
    "embeddings",
    "langchain",
    "langgraph",
    "llamaindex",
    "openai",
    "cost-reduction",
    "latency-optimization",
    "sentence-transformers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    # NumPy: <2.0.0 required — v2.0 breaks faiss-cpu and torch ABI compatibility
    "numpy>=1.24.0,<2.0.0",
    # FAISS: 1.7.4+ fixes segfaults on modern Linux/ARM64
    "faiss-cpu>=1.7.4",
    # sentence-transformers: 2.3.0+ required for BGE/modern HuggingFace model support
    "sentence-transformers>=2.3.0",
    # torch: routed to CPU index via tool.uv.sources (avoids 3GB+ nvidia CUDA packages)
    "torch",
    "click>=8.1.0",
]

[project.optional-dependencies]
redis = [
    # redis-py 5.x: built-in asyncio support and modern connection pooling
    "redis>=5.0.0,<6.0.0",
]
langchain = [
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
]
llamaindex = [
    "llama-index-core>=0.10.0",
]
openai = [
    "openai>=1.0.0",
]
server = [
    "fastapi>=0.109.0",
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]
all = [
    "longcache[redis,langchain,llamaindex,openai,server]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "build>=1.1.0",
    "twine>=5.0.0",
]

[project.scripts]
longcache = "longcache.cli:main"

[project.urls]
Repository = "https://github.com/ENDEVSOLS/LongCache"
Documentation = "https://endevsols.github.io/LongCache"
Changelog = "https://github.com/ENDEVSOLS/LongCache/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/ENDEVSOLS/LongCache/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/longcache"]

[tool.hatch.build.targets.sdist]
include = [
    "src/longcache/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402", "F401", "F541"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
