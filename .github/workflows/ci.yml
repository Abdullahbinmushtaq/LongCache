name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - name: Check lint and formatting
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LONGCACHE_TEST_REDIS_URL: redis://localhost:16379/0
      LONGCACHE_TEST_MODEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache dependencies and model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/huggingface
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}

      - name: Install locked package and test dependencies
        run: |
          pip install uv
          uv sync --locked --python ${{ matrix.python-version }} --extra all --extra dev --extra docs

      - name: Confirm Redis is reachable
        run: uv run --no-sync python -c "import os, redis; redis.Redis.from_url(os.environ['LONGCACHE_TEST_REDIS_URL']).ping()"

      - name: Run test suite with coverage
        run: |
          uv run --no-sync pytest tests/ -v --tb=short -rs --cov=src/longcache --cov-report=term-missing

      - name: Validate documentation
        if: matrix.python-version == '3.12'
        run: uv run --no-sync mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine "readme-renderer[md]"
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Check package metadata
        run: python scripts/check_package_metadata.py
